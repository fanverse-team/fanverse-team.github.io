function pkRender(id) {

function pkPick(id, i) {
  const x = S.pk && S.pk.items && S.pk.items[i]; if (!x || x.v === null) return;
  S.pk = null;
  const hid = $('#' + id), inp = $('#' + id + 'In'), c = C(x.v);

document.addEventListener('focusin', e => { const p = e.target.closest && e.target.closest('.picker'); if (!p || !e.target.classList.contains('pk-in')) return; S.pk = { id: p.dataset.pk, idx: -1, items: [] }; e.target.select(); pkRender(p.dataset.pk); });
document.addEventListener('focusout', e => {
  if (!e.target.classList || !e.target.classList.contains('pk-in')) return;
  const id = e.target.closest('.picker').dataset.pk;
  setTimeout(() => { if (document.activeElement === e.target) return; if (S.pk && S.pk.id === id) S.pk = null; e.target.value = e.target.dataset.label; pkRender(id); }, 150);
});
document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('pk-in')) { const id = e.target.closest('.picker').dataset.pk; S.pk = { id, idx: -1, items: [] }; pkRender(id); } });
document.addEventListener('keydown', e => {
  if (!e.target.classList || !e.target.classList.contains('pk-in') || !S.pk) return;
  const id = S.pk.id, n = S.pk.items.length;
  if (e.key === 'ArrowDown' && n) { e.preventDefault(); S.pk.idx = (S.pk.idx + 1) % n; pkRender(id); }
  else if (e.key === 'ArrowUp' && n) { e.preventDefault(); S.pk.idx = S.pk.idx <= 0 ? n - 1 : S.pk.idx - 1; pkRender(id); }
  else if (e.key === 'Enter') { e.preventDefault(); const i = S.pk.idx >= 0 ? S.pk.idx : S.pk.items.findIndex(x => x.v); if (i >= 0) pkPick(id, i); }
  else if (e.key === 'Escape') { e.preventDefault(); S.pk = null; e.target.value = e.target.dataset.label; pkRender(id); }
});
document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-pkv]'); if (!el) return; e.preventDefault(); S.pk = S.pk || { id: el.dataset.pkid, idx: -1, items: pkItems(el.dataset.pkid, '') }; pkPick(el.dataset.pkid, Number(el.dataset.pkv)); });

function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\r?\n/g, '\\n'); }
function downloadIcs(id) {
  const c = C(id); if (!c) return;
  const pad = n => String(n).padStart(2, '0'), stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const ev = c.d.map(([day, t], i) => {
    let when;
    if (/^\d\d:\d\d$/.test(t || '')) {
      const st = new Date(Date.parse(day + 'T' + t + ':00+08:00')), en = new Date(st.getTime() + 3 * 3600e3);
      const f = x => x.getUTCFullYear() + pad(x.getUTCMonth() + 1) + pad(x.getUTCDate()) + 'T' + pad(x.getUTCHours()) + pad(x.getUTCMinutes()) + '00Z';
      when = 'DTSTART:' + f(st) + '\r\nDTEND:' + f(en);
    } else {
      const nx = new Date(Date.parse(day + 'T00:00:00Z') + 864e5).toISOString().slice(0, 10).replace(/-/g, '');
      when = 'DTSTART;VALUE=DATE:' + day.replace(/-/g, '') + '\r\nDTEND;VALUE=DATE:' + nx;
    }
    return ['BEGIN:VEVENT', 'UID:' + c.id + '-' + i + '@fanverse-team.github.io', 'DTSTAMP:' + stamp, when,
      'SUMMARY:' + icsEsc(c.artist + '｜' + c.title), 'LOCATION:' + icsEsc(c.venue + ' ' + (VENUES[c.venue] ? VENUES[c.venue].addr || '' : '')),
      'DESCRIPTION:' + icsEsc((t ? '' : '開演時間未公布，請留意主辦公告。') + '場次資訊：' + SITE + '#c/' + c.id), 'URL:' + SITE + '#c/' + c.id,
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc('明天就是 ' + c.artist + '！記得帶票和證件'), 'TRIGGER:-P1D', 'END:VALARM', 'END:VEVENT'].join('\r\n');
  }).join('\r\n');
  const ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FANVERSE//TW\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n' + ev + '\r\nEND:VCALENDAR\r\n';
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' })); a.download = 'fanverse-' + c.id + '.ics';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('已下載行事曆檔，打開就能加入手機或 Google 行事曆');
}

const FRAUD_RULES = [
  [/匯款|轉帳|先付|訂金|ATM|無卡/, '要求先匯款、轉帳或付訂金', 25],
  [/賣貨便|連結|網址|https?:|點擊/i, '提供外部付款或賣貨便連結', 20],
  [/line|賴|私訊|私聊|加我/i, '要求加 LINE 或私下聯絡', 15],
  [/客服|驗證|認證|金流|簽署|解除/, '自稱客服、要求金流或身分驗證', 30],
  [/急|今天|馬上|限時|快|最後/, '催促你盡快成交', 10],
  [/便宜|低於|半價|特價|超殺/, '價格明顯偏離行情', 15],
  [/加價|高於原價|代價|手續費/, '加價或額外收費（門票加價轉售違反文創法）', 20]
];
function ruleFraud(t) {
  const reasons = []; let score = 0;
  FRAUD_RULES.forEach(([re, why, w]) => { if (re.test(t)) { reasons.push(why); score += w; } });
  score = Math.min(100, score);
  return { level: score >= 55 ? '高' : score >= 25 ? '中' : '低', score, reasons, advice: ['只在官方售票系統或平台內原價讓票', '堅持實名、面交或使用有保障的第三方交易', '不要點陌生連結，也不要提供任何驗證碼', '覺得可疑就撥 165 反詐騙專線'] };
}

/* ---------- 會員回報：讓使用者協助補正開演時間、票價、售票平台與延期／取消 ---------- */
// 規則：每人每場每個項目只能有一筆（可修改）；至少 3 位會員回報同一個內容、而且比其他說法多，才顯示在頁面上，並標示「會員回報」
// 官方資料優先：官方已有資料時只附註差異，不覆蓋；會員回報的時間不拿來擋同行報名
const FIX_MIN = 3, FIX_FIELDS = { time: '開演時間', price: '票價區間', platform: '售票平台', status: '延期或取消' };
const STATUS_V = ['延期', '取消', '照常'];
const fixKey = (f, day) => f + (day ? '_' + day : '');
const priceTxt = v => { const [a, b] = v.split('-').map(Number); return 'NT$' + a.toLocaleString() + (b !== a ? '–' + b.toLocaleString() : ''); };
function cleanFix(x) {
  if (!x || !FIX_FIELDS[x.f] || typeof x.v !== 'string') return null;
  const day = typeof x.day === 'string' ? x.day : '';
  if (x.f === 'time' && /^\d{4}-\d\d-\d\d$/.test(day) && /^([01]\d|2[0-3]):[0-5]\d$/.test(x.v)) return { f: 'time', day, v: x.v };
  if (x.f === 'status' && /^\d{4}-\d\d-\d\d$/.test(day) && STATUS_V.includes(x.v)) return { f: 'status', day, v: x.v };
  if (x.f === 'price' && !day && /^\d{2,6}-\d{2,6}$/.test(x.v)) return { f: 'price', day: '', v: x.v };
  if (x.f === 'platform' && !day && PLATFORMS[x.v]) return { f: 'platform', day: '', v: x.v };
  return null;
}
async function loadFixes(cid, force) {
  if (!db || !F) return;
  const cur = S.fixes[cid]; if (cur && !force && Date.now() - cur.at < 120000) return;
  try {
    const snap = await F.getDocs(F.query(F.collection(db, 'fixes', cid, 'r'), F.limit(300)));
    const tally = {}, mine = {}, me = uid();
    snap.docs.forEach(d => {
      const x = cleanFix(d.data()); if (!x) return;
      const k = fixKey(x.f, x.day); (tally[k] = tally[k] || {})[x.v] = (tally[k][x.v] || 0) + 1;
      if (me && d.id === me + '_' + k) mine[k] = x.v;
    });
    S.fixes[cid] = { at: Date.now(), tally, mine };
  } catch (e) { S.fixes[cid] = { at: Date.now(), tally: {}, mine: {}, err: true }; }
  if (S.openCid === cid && !S.fixOpen) openConcert(cid, true);
}
// 回傳 { v, n } 代表成立的會員回報；沒有就回傳 null
function crowd(cid, f, day) {
  const t = S.fixes[cid] && S.fixes[cid].tally[fixKey(f, day)]; if (!t) return null;
  const arr = Object.entries(t).sort((a, b) => b[1] - a[1]);
  if (arr[0][1] < FIX_MIN || (arr[1] && arr[1][1] >= arr[0][1])) return null;
  return { v: arr[0][0], n: arr[0][1] };
}
function crowdTag(n) { return '<span class="crowd">' + n + ' 位會員回報・未經官方確認</span>'; }
function fixForm(cid, f) {

  if (S.mode !== 'ready') return toast('登入實名會員後才能回報');
  f = FIX_FIELDS[f] ? f : 'time'; S.fixOpen = { cid, f };
  const fx = S.fixes[cid] || { mine: {} };
  const days = c.d.map(x => '<option value="' + x[0] + '">' + dinfo(x[0]).full + '（目前資料：' + esc(tm(x[1])) + '）</option>').join('');
  const mineList = Object.keys(fx.mine || {}).map(k => { const [ff, dd] = k.split('_'); const v = fx.mine[k]; return '<div class="rowline"><span>' + FIX_FIELDS[ff] + (dd ? '・' + dinfo(dd).md : '') + '：<b>' + esc(ff === 'price' ? priceTxt(v) : v) + '</b></span><button class="btn line" data-act="fixDel" data-id="' + esc(cid) + '" data-v="' + esc(k) + '">撤回</button></div>'; }).join('');
  let body = '';
  if (f === 'time') body = '<label class="f" for="fxDay">哪一場</label><select class="in" id="fxDay">' + days + '</select><label class="f" for="fxTime">開演時間</label><input class="in" id="fxTime" type="time" required>';

  else if (f === 'price') body = '<div class="grid2"><div><label class="f" for="fxMin">最低票價（NT$）</label><input class="in" id="fxMin" type="number" min="10" max="200000" required></div><div><label class="f" for="fxMax">最高票價（NT$）</label><input class="in" id="fxMax" type="number" min="10" max="200000" required></div></div><div class="hint">只有一種票價時，兩格填一樣的數字。</div>';
  else body = '<label class="f" for="fxPf">售票平台</label><select class="in" id="fxPf">' + Object.keys(PLATFORMS).map(x => '<option>' + esc(x) + '</option>').join('') + '</select>';
  openSheet('回報資料・' + c.artist,
    '<div class="safe">🙌 謝謝你幫忙！回報不會馬上改掉資料：要有 <b>' + FIX_MIN + ' 位以上會員</b>回報相同內容才會顯示，而且會標示「會員回報」；官方資料更新後一律以官方為準。請依主辦或售票網站的公告回報，不要猜。</div>' +
    '<form id="fixF" data-id="' + esc(cid) + '" data-f="' + f + '"><label class="f">要回報什麼</label><div class="seg" id="fxSeg" style="flex-wrap:wrap">' + Object.keys(FIX_FIELDS).map(k => '<button type="button" class="' + (k === f ? 'on' : '') + '" data-act="fixField" data-id="' + esc(cid) + '" data-v="' + k + '">' + FIX_FIELDS[k] + '</button>').join('') + '</div>' +
    body + '<div id="sheetErr"></div><div class="actions" style="margin-top:14px"><button class="btn line" type="button" data-act="concert" data-id="' + esc(cid) + '" style="flex:1">返回</button><button class="btn pink" type="submit" style="flex:2">送出回報</button></div></form>' +
    (mineList ? '<div class="sec">你回報過的</div>' + mineList : ''));
}
async function submitFix(form) {
  const cid = form.dataset.id, f = form.dataset.f, c = C(cid); if (!c || !FIX_FIELDS[f]) return;
  let day = '', v = '';
  if (f === 'time' || f === 'status') { day = $('#fxDay').value; if (!c.d.some(x => x[0] === day)) return sheetErr('請選擇場次'); }
  if (f === 'time') { v = $('#fxTime').value; if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(v)) return sheetErr('請填開演時間'); }
  else if (f === 'status') v = $('#fxSt').value;
  else if (f === 'price') {
    const a = Math.round(num($('#fxMin').value, 0)), b = Math.round(num($('#fxMax').value, 0));
    if (a < 10 || b < 10 || a > 200000 || b > 200000) return sheetErr('票價要在 NT$10 到 200,000 之間');
    if (a > b) return sheetErr('最低票價不能高於最高票價');
    v = a + '-' + b;
  } else v = $('#fxPf').value;
  if (!cleanFix({ f, day, v })) return sheetErr('內容格式不正確');
  const k = fixKey(f, day), u = uid(), b = F.writeBatch(db);
  b.set(F.doc(db, 'fixes', cid, 'r', u + '_' + k), { f, day, v, at: F.serverTimestamp() });
  b.set(F.doc(db, 'myFixes', u, 'k', cid + '_' + k), { at: F.serverTimestamp() });
  busyBtn(form, true, '送出中…');
  try { await b.commit(); toast('已收到回報，謝謝！'); S.fixOpen = null; await loadFixes(cid, true); openConcert(cid, true); }
  catch (e) { sheetErr(errMsg(e)); busyBtn(form, false, '送出回報'); }
}
async function delFix(cid, k) {
  const u = uid(), b = F.writeBatch(db);
  b.delete(F.doc(db, 'fixes', cid, 'r', u + '_' + k)); b.delete(F.doc(db, 'myFixes', u, 'k', cid + '_' + k));
  try { await b.commit(); toast('已撤回'); await loadFixes(cid, true); fixForm(cid, S.fixOpen ? S.fixOpen.f : 'time'); } catch (e) { toast(errMsg(e)); }
}

async function onUser(u) {

/* ---------- 多團衝突檢查 ---------- */
// 規則：
// 1. 同一場演出、同一天，包車和住宿各只能有一個「已確認」（資料庫規則強制，靠 seats 紀錄）
// 2. 同一天兩場不同演出、兩場都有公布開演時間、且演出時段（以 3 小時計）重疊 → 禁止報名（網站端檢查）
// 3. 同一天不同城市、或有一場沒公布時間 → 提醒，但可以繼續
// 4. 等待確認中的同行申請，每人最多同時 5 筆
const SHOW_HOURS = 3, MAX_PENDING = 5;
const SEAT_KIND = { 包車: 'bus', 住宿: 'stay' };
function rideIdx(r) { const c = C(r.concertId); if (!c) return null; if (typeof r.day === 'string' && r.day) { const i = c.d.findIndex(x => x[0] === r.day); return i < 0 ? null : i; } return c.d.length === 1 ? 0 : null; }
function rideSlot(r) {
  const c = r && C(r.concertId); if (!c) return null;
  const i = rideIdx(r), day = i === null ? null : c.d[i];
  return { id: r.id, c, title: r.title, date: day ? day[0] : null, time: day ? day[1] : '', city: VENUES[c.venue].city };
}
function rideDay(r) { const s = rideSlot(r); return s && s.date ? s.date : (C(r.concertId) || {}).date; }
function seatKey(r) { return SEAT_KIND[r.kind] ? r.concertId + '_' + (typeof r.day === 'string' && r.day ? r.day : 'x') + '_' + SEAT_KIND[r.kind] : ''; }

function cacheRides(list) { list.forEach(r => { S.rideCache[r.id] = r; }); }
function rideById(id) { return S.rides.find(x => x.id === id) || S.cRides.list.find(x => x.id === id) || S.rideCache[id] || null; }
async function getRide(id) {
  const hit = rideById(id); if (hit) return hit;
  try { const s = await F.getDoc(F.doc(db, 'rides', id)); if (s.exists()) { const r = Object.assign({}, s.data(), { id }); S.rideCache[id] = r; return r; } } catch (e) { }
  return null;
}
// 我目前「佔著」的團：自己發起的，加上等待確認或已確認的
async function myCommitments(exceptId) {
  const ids = new Set(S.ownRides.map(r => r.id));
  Object.keys(S.myItems).forEach(k => { const it = S.myItems[k]; if (it.type === 'ride' && ['pending', 'accepted'].includes(S.myStatus[k])) ids.add(it.targetId); });
  ids.delete(exceptId);
  return (await Promise.all([...ids].map(getRide))).filter(Boolean);
}
const toMin = t => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
// 回傳 { block: '原因' } 或 { warn: [提醒] } 或 {}
async function checkConflicts(target) {
  const t = rideSlot(target); if (!t) return {};
  if (SEAT_KIND[target.kind] && S.seats[seatKey(target)] && S.seats[seatKey(target)] !== target.id) {
    const other = rideById(S.seats[seatKey(target)]);
    return { block: '你已經在同一場、同一天的另一個' + target.kind + '團' + (other ? '「' + str(other.title, 30) + '」' : '') + '（自己發起或已確認參加），要換團請先退出那一團。' };
  }
  if (!t.date) return {};
  const warn = [];
  for (const r of await myCommitments(target.id)) {
    const s = rideSlot(r); if (!s || s.date !== t.date) continue;
    if (s.c.id === t.c.id) continue; // 同一場演出（不同類型，例如包車＋住宿）不算衝突
    if (s.time && t.time) {
      if (Math.abs(toMin(s.time) - toMin(t.time)) < SHOW_HOURS * 60) return { block: '這場和你已參加的「' + str(s.title, 30) + '」（' + s.c.artist + ' ' + s.time + '）在同一天、演出時間重疊，不能同時報名。' };
      if (s.city !== t.city) warn.push('同一天你還有「' + str(s.title, 30) + '」在' + s.city + '（' + s.time + '），兩場在不同城市，請確認來得及移動。');
    } else warn.push('同一天你還有「' + str(s.title, 30) + '」（' + s.c.artist + '・' + s.city + '），其中有一場還沒公布開演時間，請確認不會撞期。');
  }
  return warn.length ? { warn } : {};
}
function confirmSheet(title, lines, act, type, id) {

    '<div class="actions"><button class="btn line" style="flex:1" data-act="close">取消</button><button class="btn pink" style="flex:1" data-act="' + act + '" data-type="' + esc(type) + '" data-id="' + esc(id) + '">仍要繼續</button></div>');

/* ---------- 未讀提醒：每團最新訊息時間存在 meta/last，看過的時間存在這台裝置 ---------- */
// 已讀時間依帳號分開記，同一台裝置換帳號也不會互相影響
function seenAt(id) { const m = S.seen && S.seen[uid()]; return m ? num(m[id]) : 0; }

  const m = S.seen[uid()] = S.seen[uid()] || {}; m[id] = ms;
  const keys = Object.keys(m); if (keys.length > 60) keys.sort((x, y) => m[x] - m[y]).slice(0, keys.length - 60).forEach(k => delete m[k]);

}

function watchGroups() {

function compress(file, max) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type) || file.size > 15 * 1024 * 1024) return rej(new Error('type'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

  if (cost < 0 || cost > 20000) return sheetErr('費用要在 0 到 20,000 之間');
  if ((kind === '住宿' || kind === '包車') && S.profile.minor) return sheetErr('此用戶無法參與行程');
  const concertId = $('#rC').value, c = C(concertId); if (!c) return sheetErr('請選擇場次');
  const data = { kind, concertId, title, from, capacity, cost, note, owner: uid(), createdAt: F.serverTimestamp(), memberCount: 0 };
  const dv = $('#rD') ? $('#rD').value : ''; data.day = c.d.some(x => x[0] === dv) ? dv : c.d[0][0]; // 一律記日期：之後就算加開場次也不會對錯天
  const ref = F.doc(F.collection(db, 'rides')), probe = Object.assign({ id: ref.id }, data);
  if (!form.dataset.force) {
    const chk = await checkConflicts(probe);
    if (chk.block) return sheetErr(chk.block.replace('不能同時報名', '不能再發起').replace('要換團請先退出那一團', '不能再發起同類型的團'));
    if (chk.warn) { form.dataset.force = '1'; return sheetErr(chk.warn.join(' ') + ' 確定的話請再按一次「發布」。'); }
  }
  if (await postTooSoon()) return sheetErr('發文太快了：每 ' + POST_GAP + ' 秒只能發一篇，請稍等一下再按');
  busyBtn(form, true, '發布中…');
  try {
    const b = F.writeBatch(db);
    b.set(ref, data); b.set(F.doc(db, 'cool', uid()), { at: F.serverTimestamp() });
    if (seatKey(probe)) b.set(seatRef(uid(), probe), { rideId: ref.id, at: F.serverTimestamp() });
    await b.commit();
    closeSheet(); S.matchKind = '全部'; S.matchConcert = ''; render(); toast('已發布！');
  } catch (e) { sheetErr(e && e.code === 'permission-denied' && SEAT_KIND[kind] ? '你已經在同一場、同一天有另一個' + kind + '團了' : errMsg(e)); busyBtn(form, false, '發布'); }
}
async function submitTrade(form) {
  const mode = segVal('tmSeg') || '交換', have = cleanText($('#tHave').value, 50), want = cleanText($('#tWant').value, 50);
  if (mode !== '徵求' && !have) return sheetErr('請填「我有」的物品名稱');
  if (mode !== '出售' && !want) return sheetErr('請填想換或想找的東西');
  const price = Math.round(num($('#tPrice').value, 0));
  if (price < 0 || price > 100000) return sheetErr('價格要在 0 到 100,000 之間');
  const tags = cleanText($('#tTags').value, 80).split(/\s+/).filter(Boolean).slice(0, 5).map(x => x.slice(0, 16));
  busyBtn(form, true, '上架中…');
  try {
    if (await postTooSoon()) { busyBtn(form, false, '上架'); return sheetErr('發文太快了：每 ' + POST_GAP + ' 秒只能發一篇，請稍等一下再按'); }
    const tb = F.writeBatch(db); tb.set(F.doc(db, 'cool', uid()), { at: F.serverTimestamp() });
    tb.set(F.doc(F.collection(db, 'trades')), { mode, category: $('#tCat').value, have: mode === '徵求' ? '' : have, want: mode === '出售' ? '' : want, price, condition: mode === '徵求' ? '' : $('#tCond').value, concertId: $('#tC').value, tags, note: cleanText($('#tNote').value, 100), img: tradeImg, owner: uid(), createdAt: F.serverTimestamp() });
    await tb.commit();
    closeSheet(); S.marketMode = '全部'; S.marketCat = '全部'; render(); toast('已上架！');
  } catch (e) { sheetErr(errMsg(e)); busyBtn(form, false, '上架'); }
}

async function deleteAccount(form) {
  const pw = $('#delPw').value;
  if ($('#delTxt').value.trim() !== '刪除我的帳號') return sheetErr('請輸入「刪除我的帳號」');
  if (!pw) return sheetErr('請輸入密碼');
  busyBtn(form, true, '刪除中…');
  const u = uid(), user = auth.currentUser;
  try {
    await A.reauthenticateWithCredential(user, A.EmailAuthProvider.credential(user.email, pw));
    stopListeners();
    const del = async refs => { for (let i = 0; i < refs.length; i += 400) { const b = F.writeBatch(db); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); } };
    for (const [col, sub] of [['rides', 'requests'], ['trades', 'interests']]) {
      const mine = await F.getDocs(F.query(F.collection(db, col), F.where('owner', '==', u)));
      for (const d of mine.docs) { if (col === 'rides') await del(await rideExtraRefs(d.id, Object.assign({}, d.data(), { id: d.id }))); const reqs = await F.getDocs(F.collection(db, col, d.id, sub)); await del(reqs.docs.map(x => x.ref).concat([d.ref])); }
    }
    // 在別人團裡的發言也一起刪
    const chats = await F.getDocs(F.collection(db, 'myChats', u, 'rides'));
    for (const d of chats.docs) {
      const ms = await F.getDocs(F.query(F.collection(db, 'rides', d.id, 'chat'), F.where('uid', '==', u))).catch(() => ({ docs: [] }));
      await del(ms.docs.map(x => x.ref).concat([F.doc(db, 'rides', d.id, 'chatLast', u)])).catch(() => { });
      await del([d.ref]);
    }
    const items = await F.getDocs(F.collection(db, 'myRequests', u, 'items'));
    const refs = [];
    items.docs.forEach(d => { const x = d.data(); if (x.type === 'ride' || x.type === 'trade') refs.push(targetRef(x.type, String(x.targetId), u)); refs.push(d.ref); });
    await del(refs);
    const fx = await F.getDocs(F.collection(db, 'myFixes', u, 'k'));
    await del(fx.docs.map(d => { const i = d.id.indexOf('_'); return F.doc(db, 'fixes', d.id.slice(0, i), 'r', u + '_' + d.id.slice(i + 1)); }).concat(fx.docs.map(d => d.ref)));
    await del([F.doc(db, 'cool', u)]);
    // 我寫的評價、別人給我的評價、我的封鎖名單
    const mr = await F.getDocs(F.collection(db, 'myRevs', u, 'k'));
    await del(mr.docs.map(d => { const i = d.id.indexOf('_'); return F.doc(db, 'reviews', d.id.slice(0, i), 'r', d.id.slice(i + 1) + '_' + u); }).concat(mr.docs.map(d => d.ref)));
    const rv2 = await F.getDocs(F.collection(db, 'reviews', u, 'r')); await del(rv2.docs.map(d => d.ref));
    const bl = await F.getDocs(F.collection(db, 'blocks', u, 'u')); await del(bl.docs.map(d => d.ref));
    const st = await F.getDocs(F.collection(db, 'seats', u, 'k'));
    await del(st.docs.map(d => d.ref));
    const rv = await F.getDocs(F.collection(db, 'reveals', u, 'to'));
    await del(rv.docs.map(d => d.ref));
    await del([F.doc(db, 'users', u), F.doc(db, 'private', u)]);
    await A.deleteUser(user);
    closeSheet(); toast('帳號與資料已刪除');
  } catch (e) { sheetErr(errMsg(e)); busyBtn(form, false, '永久刪除'); }
}

  switch (act) {
    case 'tab': closeSheet(); go(v); break;

    case 'clearQ': S.q = ''; S.sugOpen = false; render(); { const q = $('#q'); if (q) q.focus(); } break;
    case 'clearFilters': S.city = '全部'; S.genre = '全部'; S.onlyFollow = false; render(); break;
    case 'genre': S.genre = v; render(); break;
    case 'onlyFollow': S.onlyFollow = !S.onlyFollow; render(); break;
    case 'concert': openConcert(id); break;
    case 'close': closeSheet(); break;
    case 'remind': S.reminders = S.reminders.includes(id) ? S.reminders.filter(x => x !== id) : S.reminders.concat(id); saveLS('fv_rem', S.reminders); toast(S.reminders.includes(id) ? '已收藏這場' : '已取消收藏'); openConcert(id); break;
    case 'findRide': closeSheet(); S.matchKind = '全部'; S.matchConcert = id; go('match'); break;
    case 'pkClear': if (v === 'mConcert') setMatchConcert(''); break;
    case 'planFor': closeSheet(); S.ai.concert = id; S.ai.dateIdx = Math.max(0, C(id).d.findIndex(x => x[0] === C(id).date)); S.ai.out = null; go('ai'); break;
    case 'mkind': S.matchKind = v; render(); break;
    case 'mmode': S.marketMode = v; render(); break;
    case 'mcat': S.marketCat = v; render(); break;

    case 'newTrade': tradeForm(); break;
    case 'seg': el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); break;

    case 'cancelReq': cancelReq(el.dataset.type, id); break;
    case 'reveal': revealTo(el.dataset.to); break;
    case 'manage': openManage(el.dataset.type, id); break;
    case 'accept': accept(el.dataset.who); break;
    case 'decline': decline(el.dataset.who); break;
    case 'removeMember': removeMember(el.dataset.who); break;

    case 'doDelPost': deletePost(el.dataset.type, id); break;
    case 'plan': S.ai.out = makePlan(S.ai); render(); break;
    case 'planImg': downloadPlan(); break;
    case 'group': openGroup(id); break;
    case 'gTab': if (S.group) { S.group.tab = ['plan', 'rev'].includes(v) ? v : 'chat'; S.group.editing = false; if (v === 'rev') { S.group.revReady = false; const r = groupRide(); if (r && rideDay(r) < todayTW()) loadRevState(r); } renderGroup(); } break;
    case 'revGood': sendRev(v, true); break;
    case 'revBad': sendRev(v, false); break;
    case 'revDel': delRev(v); break;
    case 'block': blockUser(v); break;
    case 'blockYes': doBlock(v, true); break;
    case 'unblock': doBlock(v, false); break;
    case 'repPost': repPost(el.dataset.type, id); break;
    case 'adminDel': adminDelPost(el.dataset.type, id); break;
    case 'admDismiss': admAct('dismiss', id); break;
    case 'admBan': admAct('ban', v); break;
    case 'admUnban': admAct('unban', v); break;
    case 'admDelTarget': admAct('delTarget', id); break;
    case 'admReload': S.admin = null; render(); break;
    case 'share': shareConcert(id); break;
    case 'ics': downloadIcs(id); break;
    case 'gEdit': if (S.group) { S.group.editing = true; renderGroup(); } break;
    case 'gEditCancel': if (S.group) { S.group.editing = false; renderGroup(); } break;
    case 'groupPlanImg': if (S.group && S.group.out) downloadPlan(S.group.out); break;
    case 'delMsg': delMsg(id); break;
    case 'repMsg': repMsg(id); break;
    case 'frSample': S.fraud.text = '大巨蛋 2 張連號搖滾區，急售！比原價便宜 2000，今天先付訂金 1000 保留，加 LINE 私聊，用賣貨便連結下單，客服會幫你做金流驗證'; S.fraud.out = null; render(); break;
    case 'fraud': if (!S.fraud.text.trim()) toast('先貼上一則訊息'); else { S.fraud.out = ruleFraud(S.fraud.text); render(); } break;
    case 'authTab': S.authTab = v; render(); break;
    case 'checkVerified': checkVerified(); break;
    case 'resendVerify': resendVerify(); break;

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value.slice(0, 60); S.sugOpen = true; S.sugIdx = -1; updateHome(); const x = $('.sclear'); if (!!S.q !== !!x) { const pos = t.selectionStart; render(); const q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (_) { } S.sugOpen = true; renderSug(); } }
  else if (t.id === 'frText') S.fraud.text = t.value.slice(0, 1200);

});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'mConcert') { S.matchConcert = t.value; render(); }
  else if (t.id === 'rC') { const box = $('#rDBox'); if (box) box.innerHTML = rideDateSel(t.value); const f = $('#rideF'); if (f) delete f.dataset.force; }
  else if (t.id === 'aiC') { S.ai.concert = t.value; S.ai.dateIdx = 0; S.ai.out = null; render(); }
  else if (t.id === 'aiDate') { S.ai.dateIdx = Number(t.value) || 0; S.ai.out = null; render(); }
  else if (t.id === 'aiFrom') { if (REGIONS[t.value]) S.ai.from = t.value; S.ai.out = null; render(); }
  else if (t.id === 'aiMode') { if (MODES.includes(t.value)) S.ai.mode = t.value; S.ai.out = null; render(); }
  else if (t.id === 'aiStay') { S.ai.stay = t.value; S.ai.out = null; render(); }
  else if (t.id === 'aiB') { S.ai.budget = t.value; S.ai.out = null; render(); }
  else if (t.id === 'pfBirth') { const bd = parseBirthday(t.value); const g = $('#guardianBox'); if (g) g.hidden = !(bd && !isAdult(bd)); }
  else if (t.id === 'tFile' && t.files && t.files[0]) {
    try {
      let url = await compress(t.files[0], 360);
      if (url.length > 150000) url = await compress(t.files[0], 240);
      if (url.length > 150000) throw new Error('size');
      tradeImg = url;
      const p = $('#tPrev'); if (p) { const img = document.createElement('img'); img.id = 'tPrev'; img.className = 'thumb'; img.alt = '預覽'; img.src = url; p.replaceWith(img); }
    } catch (_) { tradeImg = ''; toast('這張照片無法使用，換一張試試'); }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();

  else if (f.id === 'regF') doRegister(f);
  else if (f.id === 'resetF') doReset(f);

  else if (f.id === 'rideF') submitRide(f);

});
document.addEventListener('focusin', e => { if (e.target.id === 'q') { S.sugOpen = true; S.sugIdx = -1; renderSug(); } });
document.addEventListener('focusout', e => { if (e.target.id === 'q') setTimeout(() => { if (document.activeElement && document.activeElement.id === 'q') return; S.sugOpen = false; renderSug(); }, 120); });
document.addEventListener('keydown', e => {
  if (e.target.id !== 'q') return;
  const n = (S.sugItems || []).length;
  if (e.key === 'ArrowDown' && n) { e.preventDefault(); S.sugOpen = true; S.sugIdx = (S.sugIdx + 1) % n; renderSug(); }
  else if (e.key === 'ArrowUp' && n) { e.preventDefault(); S.sugIdx = S.sugIdx <= 0 ? n - 1 : S.sugIdx - 1; renderSug(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (S.sugIdx >= 0) pickSug(S.sugIdx); else { addRecent(S.q); S.sugOpen = false; renderSug(); e.target.blur(); } }
  else if (e.key === 'Escape') { S.sugOpen = false; S.sugIdx = -1; renderSug(); }
});
// 用 pointerdown 而不是 click，才不會因為輸入框先失去焦點、清單先關掉而點不到
document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-sg]'); if (!el) return; e.preventDefault(); pickSug(Number(el.dataset.sg)); });

/* ---------- boot ---------- */
async function boot() {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  // 防止別的網站把 FANVERSE 嵌進框架裡誘騙點擊（GitHub Pages 無法設定 frame-ancestors，所以用程式擋）
  if (window.top !== window.self) { document.body.innerHTML = '<p style="padding:24px;font:16px sans-serif">為了安全，請直接開啟 <a href="https://fanverse-team.github.io/" target="_top">fanverse-team.github.io</a></p>'; return; }
  route();
  loadConcerts(); loadHotels();
  if (!firebaseConfig || !firebaseConfig.apiKey || /^YOUR_/.test(firebaseConfig.apiKey)) { S.mode = 'off'; S.note = '尚未設定 Firebase，帳號功能暫停'; render(); return; }
  try {
    const [appM, authM, fsM, acM] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js'), import(FB + 'firebase-app-check.js').catch(() => null)]);
    A = authM; F = fsM;
    const app = appM.initializeApp(firebaseConfig);
    // 只在真的要讀寫資料庫或登入時才向 reCAPTCHA 取得驗證（不自動更新），省下每月免費驗證次數
    if (acM) { try { acM.initializeAppCheck(app, { provider: new acM.ReCaptchaEnterpriseProvider(RECAPTCHA_SITE_KEY), isTokenAutoRefreshEnabled: false }); } catch (e) { } }
    auth = A.getAuth(app); auth.languageCode = 'zh-TW';
    db = F.getFirestore(app);
    countVisit();
    A.onAuthStateChanged(auth, onUser);
  } catch (e) { S.mode = 'off'; S.note = '無法連線到帳號系統，請檢查網路後重新整理'; render(); }
}
boot();
