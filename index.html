const LETTER = { A: 10, B: 11, C: 12, D: 13, E: 14, F: 15, G: 16, H: 17, I: 34, J: 18, K: 19, L: 20, M: 21, N: 22, O: 35, P: 23, Q: 24, R: 25, S: 26, T: 27, U: 28, V: 29, W: 32, X: 30, Y: 31, Z: 33 };
// 身分證字號／新式居留證號：只做格式與檢查碼驗證，不代表真的查驗過身分
function checkTWID(raw) {
  const id = String(raw || '').trim().toUpperCase();
  if (!/^[A-Z][1289]\d{8}$/.test(id)) return { ok: false, msg: '格式應為 1 個英文字母＋9 個數字（例如 A123456789）' };
  const n = LETTER[id[0]];
  let sum = Math.floor(n / 10) + (n % 10) * 9;
  const w = [8, 7, 6, 5, 4, 3, 2, 1, 1];
  for (let i = 0; i < 9; i++) sum += Number(id[i + 1]) * w[i];
  if (sum % 10 !== 0) return { ok: false, msg: '檢查碼不正確，請確認有沒有打錯' };
  const g = id[1];
  return { ok: true, gender: (g === '1' || g === '8') ? '男' : '女' };
}
const DAY = 86400000;
function parseBirthday(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return null; const d = new Date(s + 'T00:00:00+08:00'); return isNaN(d) ? null : d; }
// 與安全規則相同的保守算法：成年 = 生日後 6575 天，13 歲 = 生日後 4752 天
function isAdult(bd) { return Date.now() >= bd.getTime() + 6575 * DAY; }
function atLeast13(bd) { return Date.now() >= bd.getTime() + 4752 * DAY; }
function exactAge(bd) {
  const now = new Date(Date.now() + 8 * 3600000), b = new Date(bd.getTime() + 8 * 3600000);
  let a = now.getUTCFullYear() - b.getUTCFullYear();
  if (now.getUTCMonth() < b.getUTCMonth() || (now.getUTCMonth() === b.getUTCMonth() && now.getUTCDate() < b.getUTCDate())) a--;
  return a;
}
function ageBandOf(bd) { const a = exactAge(bd); return a < 25 ? '18–24' : a < 35 ? '25–34' : a < 45 ? '35–44' : '45+'; }
const NAME_RE = /^[\p{L}\p{M}][\p{L}\p{M} ·‧.\-]{1,29}$/u;
function cleanText(s, max) { return String(s || '').replace(/[\u0000-\u001f\u007f​-‏‪-‮⁦-⁩]/g, '').trim().slice(0, max); }
function passwordProblems(pw) {
  const p = [];
  if (pw.length < 10) p.push('至少 10 個字元');
  if (!/[a-z]/.test(pw)) p.push('需要小寫英文');
  if (!/[A-Z]/.test(pw)) p.push('需要大寫英文');
  if (!/[0-9]/.test(pw)) p.push('需要數字');
  return p;
}

function rulePlan(c, from, budget, prefs) {

  const tl = [];
  tl.push({ time: t(h - (same ? 4 : 6), 0), title: '出發', detail: same ? '從' + from + '搭大眾運輸前往' + c.venue : '從' + from + '搭高鐵或包車前往' + v.city + '（同行媒合可分攤車資）', cost: same ? 'NT$50' : budget === '省錢' ? 'NT$400–650（包車分攤）' : 'NT$700–1,500' });
  if (!same) tl.push({ time: t(h - 4, 0), title: '抵達、寄放行李', detail: '先到住宿或車站寄物，輕裝入場', cost: '' });
  tl.push({ time: t(h - 3, 0), title: '吃飯', detail: prefs.includes('CP 值美食') ? '場館周邊平價小吃或拉麵，避開開演前 1 小時的排隊高峰' : '場館附近簡單吃，留時間排隊', cost: budget === '享受' ? 'NT$400–600' : 'NT$150–250' });
  tl.push({ time: t(h - 2, 0), title: '排隊入場', detail: c.rules.find(r => /排隊|入場/.test(r)) || '提早排隊入場', cost: '' });
  tl.push({ time: c.time, title: '演唱會開始 🎤', detail: c.title, cost: '' });
  tl.push({ time: t(h + 3, 0), title: '散場', detail: prefs.includes('避開散場人潮') ? v.tip : '跟著人潮搭' + v.transit.split('，')[0], cost: '' });
  tl.push({ time: t(h + 3, 40), title: same ? '回家' : '入住／回程', detail: same ? '錯峰後搭車回家' : (prefs.includes('住宿推薦') ? '住場館或車站附近，和同場粉絲分攤房費最划算' : '搭末班車或包車回程，記得確認末班時間'), cost: same ? 'NT$50' : budget === '省錢' ? 'NT$500–900（分攤房）' : 'NT$1,500–3,000' });
  const total = same ? (budget === '享受' ? 'NT$700–1,000' : 'NT$300–500') : (budget === '省錢' ? 'NT$1,300–2,000' : budget === '享受' ? 'NT$3,500–5,500' : 'NT$2,300–3,500');

}
const FRAUD_RULES = [
  [/匯款|轉帳|先付|訂金|ATM|無卡/, '要求先匯款、轉帳或付訂金', 25],
  [/賣貨便|連結|網址|https?:|點擊/i, '提供外部付款或賣貨便連結', 20],
  [/line|賴|私訊|私聊|加我/i, '要求加 LINE 或私下聯絡', 15],
  [/客服|驗證|認證|金流|簽署|解除/, '自稱客服、要求金流或身分驗證', 30],
  [/急|今天|馬上|限時|快|最後/, '催促你盡快成交', 10],
  [/便宜|低於|半價|特價|超殺/, '價格明顯偏離行情', 15],
  [/加價|高於原價|代價|手續費/, '加價或額外收費（門票加價轉售違反文創法）', 20]
];
function ruleFraud(t) {
  const reasons = []; let score = 0;
  FRAUD_RULES.forEach(([re, why, w]) => { if (re.test(t)) { reasons.push(why); score += w; } });
  score = Math.min(100, score);
  return { level: score >= 55 ? '高' : score >= 25 ? '中' : '低', score, reasons, advice: ['只在官方售票系統或平台內原價讓票', '堅持實名、面交或使用有保障的第三方交易', '不要點陌生連結，也不要提供任何驗證碼', '覺得可疑就撥 165 反詐騙專線'] };
}

/* ---------- auth actions ---------- */
function actionSettings() { return location.protocol === 'https:' ? { url: location.origin + location.pathname, handleCodeInApp: false } : undefined; }
async function doLogin(form) {

}
async function doRegister(form) {
  const email = $('#rgEmail').value.trim(), pw = $('#rgPw').value, pw2 = $('#rgPw2').value;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setErr('信箱格式不正確');
  const probs = passwordProblems(pw);
  if (probs.length) return setErr('密碼' + probs.join('、'));
  if (pw !== pw2) return setErr('兩次輸入的密碼不一樣');
  if (!$('#rgAgree').checked) return setErr('請先閱讀並同意個人資料蒐集告知暨隱私權政策');
  busyBtn(form, true, '建立中…'); setErr('');
  try {
    if (A.validatePassword) { const st = await A.validatePassword(auth, pw); if (!st.isValid) { busyBtn(form, false, '建立帳號並寄出驗證信'); return setErr('密碼不符合規定：至少 10 碼，需含大小寫英文與數字'); } }
    const cred = await A.createUserWithEmailAndPassword(auth, email, pw);
    try { await A.sendEmailVerification(cred.user, actionSettings()); S.lastVerifySend = Date.now(); } catch (e) { toast('驗證信寄送失敗，請稍後按「重新寄送」'); }
  } catch (e) { setErr(errMsg(e)); busyBtn(form, false, '建立帳號並寄出驗證信'); }
}
async function doReset(form) {
  const email = $('#rsEmail').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setErr('信箱格式不正確');
  busyBtn(form, true, '寄送中…');
  try { await A.sendPasswordResetEmail(auth, email, actionSettings()); } catch (e) { if (e && e.code === 'auth/too-many-requests') { busyBtn(form, false, '寄出重設連結'); return setErr(errMsg(e)); } }

  form.innerHTML = '<p style="margin:0;font-size:14px;line-height:1.8">如果這個信箱有註冊 FANVERSE，幾分鐘內會收到重設密碼的信。</p><button type="button" class="linkbtn" data-act="authTab" data-v="login">← 回到登入</button>';
}
async function checkVerified() {

async function resendVerify() {

/* ---------- session ---------- */
function stopListeners() {
  S.unsubs.forEach(f => { try { f(); } catch (e) { } }); S.unsubs = [];
  Object.values(S.itemUnsubs).forEach(f => { try { f(); } catch (e) { } }); S.itemUnsubs = {};
  Object.values(S.revealUnsubs).forEach(f => { try { f(); } catch (e) { } }); S.revealUnsubs = {};
  if (S.manageUnsub) { S.manageUnsub(); S.manageUnsub = null; }
}
async function onUser(u) {
  stopListeners();
  Object.assign(S, { user: u, profile: null, priv: null, rides: [], trades: [], ridesReady: false, tradesReady: false, pub: {}, myItems: {}, myStatus: {}, revealedToMe: {}, myReveals: {}, note: '' });
  if (!u) { S.mode = 'out'; render(); return; }
  if (!u.emailVerified) {
    // 使用者可能剛在另一個分頁點了驗證連結，先安靜地重新整理一次狀態
    try { await A.reload(u); } catch (e) { }
    if (!u.emailVerified) { S.mode = 'verify'; render(); return; }
  }
  S.mode = 'loading'; render();
  try {
    await u.getIdToken(true);
    const [p, q] = await Promise.all([F.getDoc(F.doc(db, 'users', u.uid)), F.getDoc(F.doc(db, 'private', u.uid))]);
    if (p.exists() && q.exists()) {
      S.profile = p.data(); S.priv = q.data(); S.pub[u.uid] = S.profile; S.mode = 'ready';
      await refreshAgeBand();
      startListeners();
    } else S.mode = 'profile';
  } catch (e) { S.mode = 'off'; S.note = '讀取帳號資料失敗：' + errMsg(e); }
  render();
}
// 年齡區間與未成年狀態隨時間改變時自動更新
async function refreshAgeBand() {
  const bd = S.priv.birthday && S.priv.birthday.toDate ? S.priv.birthday.toDate() : null; if (!bd) return;
  const minor = !isAdult(bd), band = minor ? '' : ageBandOf(bd);
  if (minor === S.profile.minor && band === S.profile.ageBand) return;
  try { await F.updateDoc(F.doc(db, 'users', uid()), { minor, ageBand: band, updatedAt: F.serverTimestamp() }); Object.assign(S.profile, { minor, ageBand: band }); } catch (e) { }
}
function startListeners() {
  const u = uid();
  S.unsubs.push(F.onSnapshot(F.query(F.collection(db, 'rides'), F.orderBy('createdAt', 'desc'), F.limit(100)), snap => {
    S.rides = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })); S.ridesReady = true; loadPubs(S.rides.map(r => r.owner)); renderData();
  }, e => { S.ridesReady = true; S.note = '媒合資料讀取失敗：' + errMsg(e); renderData(); }));
  S.unsubs.push(F.onSnapshot(F.query(F.collection(db, 'trades'), F.orderBy('createdAt', 'desc'), F.limit(100)), snap => {
    S.trades = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })); S.tradesReady = true; loadPubs(S.trades.map(t => t.owner)); renderData();
  }, e => { S.tradesReady = true; S.note = '交換資料讀取失敗：' + errMsg(e); renderData(); }));
  S.unsubs.push(F.onSnapshot(F.collection(db, 'myRequests', u, 'items'), snap => {
    const items = {}; snap.docs.forEach(d => { const x = d.data(); if (x && (x.type === 'ride' || x.type === 'trade')) items[d.id] = { type: x.type, targetId: String(x.targetId) }; });
    syncItems(items); renderData();
  }, () => { }));
  S.unsubs.push(F.onSnapshot(F.collection(db, 'reveals', u, 'to'), snap => {
    S.myReveals = {}; snap.docs.forEach(d => { S.myReveals[d.id] = true; }); loadPubs(Object.keys(S.myReveals)); renderData();
  }, () => { }));
}
function targetRef(type, id, who) { return type === 'ride' ? F.doc(db, 'rides', id, 'requests', who) : F.doc(db, 'trades', id, 'interests', who); }
function syncItems(items) {
  Object.keys(S.itemUnsubs).forEach(k => { if (!items[k]) { S.itemUnsubs[k](); delete S.itemUnsubs[k]; delete S.myStatus[k]; } });
  S.myItems = items;
  Object.keys(items).slice(0, 40).forEach(k => {
    if (S.itemUnsubs[k]) return;
    const it = items[k];
    S.itemUnsubs[k] = F.onSnapshot(targetRef(it.type, it.targetId, uid()), snap => {
      S.myStatus[k] = snap.exists() ? snap.data().status : 'gone';
      if (S.myStatus[k] === 'accepted') watchRevealFrom(it.type, it.targetId);
      renderData();
    }, () => { S.myStatus[k] = 'gone'; renderData(); });
  });
}
async function ownerOf(type, id) {
  const list = type === 'ride' ? S.rides : S.trades, hit = list.find(x => x.id === id);
  if (hit) return hit.owner;
  try { const s = await F.getDoc(F.doc(db, type === 'ride' ? 'rides' : 'trades', id)); return s.exists() ? s.data().owner : ''; } catch (e) { return ''; }
}
async function watchRevealFrom(type, id) {
  const owner = await ownerOf(type, id); if (!owner || S.revealUnsubs[owner]) return;
  S.revealUnsubs[owner] = F.onSnapshot(F.doc(db, 'reveals', owner, 'to', uid()), s => { S.revealedToMe[owner] = s.exists() ? str(s.data().realName, 30) : ''; renderData(); if (S.manage) renderManage(); }, () => { });
}
const pubLoading = {};
function loadPubs(ids) {
  [...new Set(ids)].forEach(id => {
    if (!id || id in S.pub || pubLoading[id]) return;
    pubLoading[id] = true;
    F.getDoc(F.doc(db, 'users', id)).then(s => {
      S.pub[id] = s.exists() ? s.data() : null;
      // 對方已刪除帳號：收回我曾揭露給他的實名
      if (!s.exists() && S.myReveals[id] && id !== uid()) F.deleteDoc(F.doc(db, 'reveals', uid(), 'to', id)).catch(() => { });
    }).catch(() => { S.pub[id] = null; }).finally(() => { delete pubLoading[id]; renderData(); if (S.manage) renderManage(); });
  });
}

/* ---------- 媒合／交易流程 ---------- */
async function commit(batch, okMsg) {
  try { await batch.commit(); if (okMsg) toast(okMsg); return true; } catch (e) { toast(errMsg(e)); return false; }
}
async function withLock(key, fn) { if (S.busy[key]) return; S.busy[key] = true; try { await fn(); } finally { S.busy[key] = false; } }
function apply(type, id) {
  return withLock(type + id, async () => {
    if (type === 'ride') { const r = S.rides.find(x => x.id === id); if (r && r.kind === '住宿' && S.profile.minor) return toast('未成年帳號不能參加住宿分攤'); }
    const u = uid(), b = F.writeBatch(db);
    b.set(targetRef(type, id, u), { uid: u, status: 'pending', createdAt: F.serverTimestamp() });
    b.set(F.doc(db, 'myRequests', u, 'items', type + '_' + id), { type, targetId: id, createdAt: F.serverTimestamp() });
    await commit(b, type === 'ride' ? '已送出申請，等發起人確認' : '已通知對方你有興趣');
  });
}
function stillLinkedTo(owner, exceptKey) {
  return Object.keys(S.myItems).some(k => k !== exceptKey && S.myStatus[k] === 'accepted' && ((S.myItems[k].type === 'ride' ? S.rides : S.trades).find(x => x.id === S.myItems[k].targetId) || {}).owner === owner);
}
function cancelReq(type, id) {
  return withLock(type + id, async () => {
    const u = uid(), key = type + '_' + id, b = F.writeBatch(db);
    b.delete(targetRef(type, id, u));
    b.delete(F.doc(db, 'myRequests', u, 'items', key));
    const owner = await ownerOf(type, id);
    if (owner && S.myReveals[owner] && !stillLinkedTo(owner, key)) b.delete(F.doc(db, 'reveals', u, 'to', owner));
    await commit(b, '已取消');
  });
}
async function revealTo(to) {
  if (S.profile.minor || !to || to === uid() || S.myReveals[to]) return;
  return withLock('rv' + to, async () => {
    try { await F.setDoc(F.doc(db, 'reveals', uid(), 'to', to), { realName: S.priv.realName, createdAt: F.serverTimestamp() }); toast('已向對方公開你的實名'); }
    catch (e) { toast(errMsg(e)); }
  });
}
function openManage(type, id) {
  if (S.manageUnsub) { S.manageUnsub(); S.manageUnsub = null; }
  S.manage = { type, id, list: [], ready: false };
  renderManage();
  const col = F.collection(db, type === 'ride' ? 'rides' : 'trades', id, type === 'ride' ? 'requests' : 'interests');
  S.manageUnsub = F.onSnapshot(col, snap => {
    if (!S.manage) return;
    S.manage.list = snap.docs.map(d => Object.assign({}, d.data(), { uid: d.id })); S.manage.ready = true;
    loadPubs(S.manage.list.map(x => x.uid));
    S.manage.list.filter(x => x.status === 'accepted').forEach(x => watchRevealOwner(x.uid));
    if (type === 'ride') {
      const r = S.rides.find(x => x.id === id), acc = S.manage.list.filter(x => x.status === 'accepted').length;
      if (r && num(r.memberCount) !== acc && acc < num(r.capacity)) F.updateDoc(F.doc(db, 'rides', id), { memberCount: acc }).catch(() => { });
    }
    renderManage();
  }, e => { if (S.manage) { S.manage.ready = true; S.manage.err = errMsg(e); renderManage(); } });
}
function watchRevealOwner(other) {
  if (S.revealUnsubs[other]) return;
  S.revealUnsubs[other] = F.onSnapshot(F.doc(db, 'reveals', other, 'to', uid()), s => { S.revealedToMe[other] = s.exists() ? str(s.data().realName, 30) : ''; if (S.manage) renderManage(); renderData(); }, () => { });
}
function renderManage() {
  const m = S.manage; if (!m) return;
  const isRide = m.type === 'ride', post = (isRide ? S.rides : S.trades).find(x => x.id === m.id);
  const rows = m.list.map(x => {
    const p = S.pub[x.uid], name = S.revealedToMe[x.uid];
    let act = '';
    if (x.status === 'pending') act = '<button class="btn pink" data-act="accept" data-who="' + esc(x.uid) + '">' + (S.profile.minor ? '接受' : '接受並公開我的實名') + '</button><button class="btn line" data-act="decline" data-who="' + esc(x.uid) + '">婉拒</button>';
    else if (x.status === 'accepted') act = '<div class="okbox">✓ 已接受' + (name ? '・對方實名：<b>' + esc(name) + '</b>' : '・等對方確認後會顯示實名') + '</div><button class="btn line" data-act="removeMember" data-who="' + esc(x.uid) + '">移除</button>';
    else act = '<span class="pill">已婉拒</span><button class="btn line" data-act="removeMember" data-who="' + esc(x.uid) + '">刪除紀錄</button>';
    return '<div class="card" style="margin-bottom:8px">' + personBlock(x.uid) + (p && p.minor ? '<div class="hint">對方是未成年帳號，請特別注意安全與分寸。</div>' : '') + '<div class="actions">' + act + '</div></div>';
  }).join('');
  openSheet(isRide ? '管理申請' : '有興趣的人',
    (post ? '<div class="psub" style="margin-bottom:10px">' + esc(str(post.title || post.have || post.want, 40)) + (isRide ? '・目前 ' + Math.min(num(post.capacity), 1 + num(post.memberCount)) + ' / ' + num(post.capacity) + ' 人' : '') + '</div>' : '') +
    '<div class="safe">接受後，你的真實姓名會顯示給這位會員；對方確認後，你也會看到對方的實名。</div>' +
    (m.err ? '<div class="err">' + esc(m.err) + '</div>' : '') +
    (!m.ready ? '<div class="empty">載入中…</div>' : rows || '<div class="empty">目前還沒有人申請</div>'));
}
function accept(who) {
  const m = S.manage; if (!m) return;
  return withLock('acc' + who, async () => {
    const isRide = m.type === 'ride', b = F.writeBatch(db);
    if (isRide) {
      const r = S.rides.find(x => x.id === m.id);
      if (r && 1 + num(r.memberCount) >= num(r.capacity)) return toast('已額滿，無法再接受');
      b.update(F.doc(db, 'rides', m.id), { memberCount: F.increment(1) });
    }
    b.update(targetRef(m.type, m.id, who), { status: 'accepted' });
    if (!S.profile.minor && !S.myReveals[who]) b.set(F.doc(db, 'reveals', uid(), 'to', who), { realName: S.priv.realName, createdAt: F.serverTimestamp() });
    await commit(b, S.profile.minor ? '已接受' : '已接受，並向對方公開你的實名');
  });
}
function decline(who) {
  const m = S.manage; if (!m) return;
  return withLock('dec' + who, async () => { const b = F.writeBatch(db); b.update(targetRef(m.type, m.id, who), { status: 'declined' }); await commit(b, '已婉拒'); });
}
function removeMember(who) {
  const m = S.manage; if (!m) return;
  return withLock('rm' + who, async () => {
    const x = m.list.find(y => y.uid === who), b = F.writeBatch(db);
    b.delete(targetRef(m.type, m.id, who));
    if (m.type === 'ride' && x && x.status === 'accepted') { const r = S.rides.find(y => y.id === m.id); if (r && num(r.memberCount) > 0) b.update(F.doc(db, 'rides', m.id), { memberCount: F.increment(-1) }); }
    if (S.myReveals[who]) b.delete(F.doc(db, 'reveals', uid(), 'to', who));
    await commit(b, '已移除');
  });
}
async function deletePost(type, id) {
  return withLock('del' + id, async () => {
    try {
      const col = type === 'ride' ? 'rides' : 'trades', sub = type === 'ride' ? 'requests' : 'interests';
      const reqs = await F.getDocs(F.collection(db, col, id, sub));
      const b = F.writeBatch(db);
      reqs.docs.forEach(d => { b.delete(d.ref); if (d.data().status === 'accepted' && S.myReveals[d.id]) b.delete(F.doc(db, 'reveals', uid(), 'to', d.id)); });
      b.delete(F.doc(db, col, id));
      await b.commit(); closeSheet(); toast('已刪除');
    } catch (e) { toast(errMsg(e)); }
  });
}

// 用 canvas 重新編碼：縮小尺寸，同時去掉 EXIF（含 GPS 位置）
function compress(file, max) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type) || file.size > 15 * 1024 * 1024) return rej(new Error('type'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

async function deleteAccount(form) {
  const pw = $('#delPw').value;
  if ($('#delTxt').value.trim() !== '刪除我的帳號') return sheetErr('請輸入「刪除我的帳號」');
  if (!pw) return sheetErr('請輸入密碼');
  busyBtn(form, true, '刪除中…');
  const u = uid(), user = auth.currentUser;
  try {
    await A.reauthenticateWithCredential(user, A.EmailAuthProvider.credential(user.email, pw));
    stopListeners();
    const del = async refs => { for (let i = 0; i < refs.length; i += 400) { const b = F.writeBatch(db); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); } };
    for (const [col, sub] of [['rides', 'requests'], ['trades', 'interests']]) {
      const mine = await F.getDocs(F.query(F.collection(db, col), F.where('owner', '==', u)));
      for (const d of mine.docs) { const reqs = await F.getDocs(F.collection(db, col, d.id, sub)); await del(reqs.docs.map(x => x.ref).concat([d.ref])); }
    }
    const items = await F.getDocs(F.collection(db, 'myRequests', u, 'items'));
    const refs = [];
    items.docs.forEach(d => { const x = d.data(); if (x.type === 'ride' || x.type === 'trade') refs.push(targetRef(x.type, String(x.targetId), u)); refs.push(d.ref); });
    await del(refs);
    const rv = await F.getDocs(F.collection(db, 'reveals', u, 'to'));
    await del(rv.docs.map(d => d.ref));
    await del([F.doc(db, 'users', u), F.doc(db, 'private', u)]);
    await A.deleteUser(user);
    closeSheet(); toast('帳號與資料已刪除');
  } catch (e) { sheetErr(errMsg(e)); busyBtn(form, false, '永久刪除'); }
}

  else if (t.id === 'aiB') S.ai.budget = t.value;
  else if (t.id === 'pfBirth') { const bd = parseBirthday(t.value); const g = $('#guardianBox'); if (g) g.hidden = !(bd && !isAdult(bd)); }
  else if (t.id === 'tFile' && t.files && t.files[0]) {
    try {
      let url = await compress(t.files[0], 360);
      if (url.length > 150000) url = await compress(t.files[0], 240);
      if (url.length > 150000) throw new Error('size');
      tradeImg = url;
      const p = $('#tPrev'); if (p) { const img = document.createElement('img'); img.id = 'tPrev'; img.className = 'thumb'; img.alt = '預覽'; img.src = url; p.replaceWith(img); }
    } catch (_) { tradeImg = ''; toast('這張照片無法使用，換一張試試'); }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'loginF') doLogin(f);
  else if (f.id === 'regF') doRegister(f);
  else if (f.id === 'resetF') doReset(f);
  else if (f.id === 'profF') doProfile(f);
  else if (f.id === 'rideF') submitRide(f);
  else if (f.id === 'tradeF') submitTrade(f);
  else if (f.id === 'nickF') submitNick(f);
  else if (f.id === 'delF') deleteAccount(f);
});
$('#veil').addEventListener('click', e => { if (e.target.id === 'veil') closeSheet(); });

/* ---------- boot ---------- */
async function boot() {
  route();
  if (!firebaseConfig || !firebaseConfig.apiKey || /^YOUR_/.test(firebaseConfig.apiKey)) { S.mode = 'off'; S.note = '尚未設定 Firebase，帳號功能暫停'; render(); return; }
  try {
    const [appM, authM, fsM] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
    A = authM; F = fsM;
    const app = appM.initializeApp(firebaseConfig);
    auth = A.getAuth(app); auth.languageCode = 'zh-TW';
    db = F.getFirestore(app);
    A.onAuthStateChanged(auth, onUser);
  } catch (e) { S.mode = 'off'; S.note = '無法連線到帳號系統，請檢查網路後重新整理'; render(); }
}
boot();
</script>
