document.addEventListener('focusin', e => { const p = e.target.closest && e.target.closest('.picker'); if (!p || !e.target.classList.contains('pk-in')) return; S.pk = { id: p.dataset.pk, idx: -1, items: [] }; e.target.select(); pkRender(p.dataset.pk); });
document.addEventListener('focusout', e => {
  if (!e.target.classList || !e.target.classList.contains('pk-in')) return;
  const id = e.target.closest('.picker').dataset.pk;
  setTimeout(() => { if (document.activeElement === e.target) return; if (S.pk && S.pk.id === id) S.pk = null; e.target.value = e.target.dataset.label; pkRender(id); }, 150);

document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('pk-in')) { const id = e.target.closest('.picker').dataset.pk; S.pk = { id, idx: -1, items: [] }; pkRender(id); } });

  if (e.key === 'ArrowDown' && n) { e.preventDefault(); S.pk.idx = (S.pk.idx + 1) % n; pkRender(id); }

  else if (e.key === 'Enter') { e.preventDefault(); const i = S.pk.idx >= 0 ? S.pk.idx : S.pk.items.findIndex(x => x.v); if (i >= 0) pkPick(id, i); }

/* ---------- Plus：多人分帳計算機（資料只存在你的瀏覽器） ---------- */
function splitData(key) { const d = loadLS('fv_split_' + key, null); return d && Array.isArray(d.people) && Array.isArray(d.items) ? d : { people: [], items: [] }; }
function splitSave(key, d) { saveLS('fv_split_' + key, { people: d.people.slice(0, 20), items: d.items.slice(0, 60) }); }
function settle(d) {
  const n = d.people.length; if (!n) return { total: 0, each: 0, moves: [] };
  const paid = {}; d.people.forEach(p => { paid[p] = 0; });
  d.items.forEach(x => { if (paid[x.who] !== undefined) paid[x.who] += num(x.amt); });
  const total = Object.values(paid).reduce((a, b) => a + b, 0), each = total / n;
  const bal = d.people.map(p => [p, Math.round((paid[p] - each) * 100) / 100]);
  const cr = bal.filter(b => b[1] > 0.5).sort((a, b) => b[1] - a[1]), db2 = bal.filter(b => b[1] < -0.5).sort((a, b) => a[1] - b[1]), moves = [];
  let i = 0, j = 0;
  while (i < db2.length && j < cr.length) {
    const m = Math.min(-db2[i][1], cr[j][1]);
    moves.push([db2[i][0], cr[j][0], Math.round(m)]);
    db2[i][1] += m; cr[j][1] -= m;
    if (-db2[i][1] < 0.5) i++; if (cr[j][1] < 0.5) j++;
  }
  return { total: Math.round(total), each: Math.round(each), moves, paid };
}

  const d = splitData(key);
  if (!d.people.length && defaults && defaults.length) { d.people = defaults.slice(0, 20); splitSave(key, d); }
  const r = settle(d), money = n => 'NT$' + Math.round(n).toLocaleString();

function fitOptions(opts, reg, dest, mob) {

  if (!mob || !mob.length) return opts;

  if (mob.includes('機車')) { const b = tripBase(reg, dest); if (b && b[0] <= 70) out.push({ mode: '騎機車', min: Math.round(b[0] * 2.6), cost: r50(Math.max(100, b[1] * 0.15)), note: '機動性高；長途騎車很累，每小時休息一次，散場後別疲勞騎車' }); }
  return out.map(o => Object.assign({}, o, { fit: (o.mode === '自行開車' && mob.includes('汽車')) || (o.mode === '騎機車') || (mob.includes('身障') && (o.mode === '高鐵' || o.mode === '台鐵')) }))

}

/* ---------- 每日交通導覽（Plus）：每一天一張路線示意圖 ---------- */
const GUIDE_RE = /出發|出門|抵達|到場館|入場|開演|散場|回程|回家|到家|夜車|退房|行李|回住宿|入住/;
function guideDays(o) {
  const days = [], by = {};
  for (const x of o.tl) {
    if (!GUIDE_RE.test(x.h)) continue;
    const k = x.day; if (!by[k]) { by[k] = { day: k, label: o.dayLabels[k] || dinfo(k).full, steps: [] }; days.push(by[k]); }
    const kind = /出發|出門|回程|回家|夜車/.test(x.h) ? 'go' : /抵達|到家/.test(x.h) ? 'arr' : /開演|入場|散場|到場館/.test(x.h) ? 'venue' : 'stay';
    by[k].steps.push({ t: x.t, h: x.h, d: x.d || '', kind });
  }
  // 抵達後補上最後一哩，散場前補上捷運末班
  const lm = lastMile(o.c.venue, o.mob || [], o.acc), m = TRANSIT[o.c.venue] && TRANSIT[o.c.venue].mrt[0], ml = mrtLast(m);
  for (const d of days) {
    const i = d.steps.findIndex(s => /^抵達/.test(s.h)); if (i >= 0 && lm) d.steps.splice(i + 1, 0, { t: '', h: '轉市區交通', d: lm, kind: 'metro' });
    const j = d.steps.findIndex(s => /散場/.test(s.h)); if (j >= 0 && ml) d.steps.splice(j + 1, 0, { t: '', h: m.n + '末班車', d: m.last.map(l => l[0] + ' ' + l[2]).join('、'), kind: 'metro' });
  }

}

/* ---------- 個人化推薦：依追蹤的藝人、收藏的活動推薦相似的場次 ---------- */
function recommend(n) {

  if (!fol.length && !favs.length) return [];
  const g = {}, kind = {}, city = {};
  up.filter(c => fol.includes(c.artist)).concat(favs).forEach(c => { g[c.genre] = (g[c.genre] || 0) + 2; kind[c.k || 'concert'] = (kind[c.k || 'concert'] || 0) + 1; const ct = V(c.venue).city; if (ct) city[ct] = (city[ct] || 0) + 1; });

    const why = [];
    let s = (g[c.genre] || 0) * 3 + (kind[c.k || 'concert'] || 0) + (city[V(c.venue).city] || 0) * 1.5 - Math.max(0, daysLeft(c.date)) / 60;

}

const FRAUD_RULES = [

  [/賣貨便|連結|網址|https?:|點擊/i, '提供外部付款或賣貨便連結', 20],

}

/* ---------- 媒合／交易流程 ---------- */
async function commit(batch, okMsg) {
  try { await batch.commit(); if (okMsg) toast(okMsg); return true; } catch (e) { toast(errMsg(e)); return false; }
}
async function withLock(key, fn) { if (S.busy[key]) return; S.busy[key] = true; try { await fn(); } finally { S.busy[key] = false; } }
function apply(type, id, force) {
  return withLock(type + id, async () => {
    if (type === 'ride') {
      const r = rideById(id); if (!r) return toast('找不到這個媒合');
      if ((r.kind === '住宿' || r.kind === '包車') && S.profile.minor) return toast('此用戶無法參與行程');
      const pend = Object.keys(S.myStatus).filter(k => k.startsWith('ride_') && S.myStatus[k] === 'pending').length;
      if (pend >= MAX_PENDING) return openSheet('先等一下', '<p style="font-size:14px;line-height:1.8">你已經有 ' + pend + ' 筆同行申請在等發起人確認，最多同時 ' + MAX_PENDING + ' 筆。可以先取消不需要的申請，或等對方回覆。</p><button class="btn line full" data-act="close">知道了</button>');
      const chk = await checkConflicts(r);
      if (chk.block) return openSheet('不能報名', '<p style="font-size:14px;line-height:1.8">' + esc(chk.block) + '</p><button class="btn line full" data-act="close">知道了</button>');
      if (chk.warn && !force) return confirmSheet('報名前提醒', chk.warn, 'applyForce', type, id);
    }
    const u = uid(), b = F.writeBatch(db);
    b.set(targetRef(type, id, u), { uid: u, status: 'pending', createdAt: F.serverTimestamp() });
    b.set(F.doc(db, 'myRequests', u, 'items', type + '_' + id), { type, targetId: id, createdAt: F.serverTimestamp() });
    await commit(b, type === 'ride' ? '已送出申請，等發起人確認' : '已通知對方你有興趣');
  });
}
function stillLinkedTo(owner, exceptKey) {
  return Object.keys(S.myItems).some(k => k !== exceptKey && S.myStatus[k] === 'accepted' && ((S.myItems[k].type === 'ride' ? rideById(S.myItems[k].targetId) : S.trades.find(x => x.id === S.myItems[k].targetId)) || {}).owner === owner);
}
function cancelReq(type, id) {
  return withLock(type + id, async () => {
    const u = uid(), key = type + '_' + id, b = F.writeBatch(db);
    b.delete(targetRef(type, id, u));
    if (type === 'ride') Object.keys(S.seats).forEach(k => { if (S.seats[k] === id) b.delete(F.doc(db, 'seats', u, 'k', k)); });
    b.delete(F.doc(db, 'myRequests', u, 'items', key));
    const owner = await ownerOf(type, id);
    if (owner && S.myReveals[owner] && !stillLinkedTo(owner, key)) b.delete(F.doc(db, 'reveals', u, 'to', owner));
    await commit(b, '已取消');
  });
}

  return withLock('rv' + to, async () => {
    try { await F.setDoc(F.doc(db, 'reveals', uid(), 'to', to), { realName: S.priv.realName, createdAt: F.serverTimestamp() }); toast('已向對方公開你的實名'); }
    catch (e) { toast(errMsg(e)); }

}

  renderManage();
  const col = F.collection(db, type === 'ride' ? 'rides' : 'trades', id, type === 'ride' ? 'requests' : 'interests');
  S.manageUnsub = F.onSnapshot(col, snap => {
    if (!S.manage) return;
    S.manage.list = snap.docs.map(d => Object.assign({}, d.data(), { uid: d.id })); S.manage.ready = true;
    loadPubs(S.manage.list.map(x => x.uid));
    S.manage.list.filter(x => x.status === 'accepted').forEach(x => watchRevealOwner(x.uid));
    if (type === 'ride') {
      const r = rideById(id), acc = S.manage.list.filter(x => x.status === 'accepted').length;
      if (r && num(r.memberCount) !== acc && acc < num(r.capacity)) F.updateDoc(F.doc(db, 'rides', id), { memberCount: acc }).catch(() => { });
    }
    renderManage();
  }, e => { if (S.manage) { S.manage.ready = true; S.manage.err = errMsg(e); renderManage(); } });
}
function watchRevealOwner(other) {
  if (S.revealUnsubs[other]) return;
  S.revealUnsubs[other] = F.onSnapshot(F.doc(db, 'reveals', other, 'to', uid()), s => { S.revealedToMe[other] = s.exists() ? str(s.data().realName, 30) : ''; if (S.manage) renderManage(); renderData(); }, () => { });

function renderManage() {

// 用 canvas 重新編碼：縮小尺寸，同時去掉 EXIF（含 GPS 位置）
function compress(file, max) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type) || file.size > 15 * 1024 * 1024) return rej(new Error('type'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if (act === 'follow') { e.stopPropagation(); const a = el.dataset.artist; if (!S.follows.includes(a) && overLimit('follow')) return; S.follows = S.follows.includes(a) ? S.follows.filter(x => x !== a) : S.follows.concat(a); saveLS('fv_follows2', S.follows); if (S.follows.includes(a)) bump('follow', a); pushSync(); toast(S.follows.includes(a) ? '已追蹤 ' + a : '已取消追蹤'); render(); return; }
  switch (act) {
    case 'tab': closeSheet(); go(v); break;
    case 'city': S.city = S.city === v && !AREAS[v] ? (Object.keys(AREAS).find(a => AREAS[a].includes(v)) || '全部') : v; S.homeLimit = 0; render(); break;
    case 'kind': if (KINDS.some(k => k[0] === v)) { S.kind = v; S.genre = '全部'; S.homeLimit = 0; if (v !== 'concert') S.onlyFollow = false; render(); } break;
    case 'more': S.homeLimit = (S.homeLimit || PAGE) + PAGE; updateHome(); break;
    case 'clearQ': S.q = ''; S.sugOpen = false; render(); { const q = $('#q'); if (q) q.focus(); } break;
    case 'clearFilters': S.city = '全部'; S.genre = '全部'; S.onlyFollow = false; render(); break;
    case 'genre': S.genre = v; S.homeLimit = 0; render(); break;
    case 'onlyFollow': S.onlyFollow = !S.onlyFollow; render(); break;
    case 'concert': openConcert(id); break;
    case 'close': closeSheet(); break;
    case 'remind': if (!S.reminders.includes(id) && overLimit('rem')) break; S.reminders = S.reminders.includes(id) ? S.reminders.filter(x => x !== id) : S.reminders.concat(id); saveLS('fv_rem', S.reminders); if (S.reminders.includes(id)) bump('fav', id); pushSync(); toast(S.reminders.includes(id) ? '已收藏' : '已取消收藏'); openConcert(id); break;
    case 'findRide': closeSheet(); S.matchKind = '全部'; S.matchConcert = id; go('match'); break;
    case 'pkClear': if (v === 'mConcert') setMatchConcert(''); break;
    case 'planFor': closeSheet(); S.ai.concert = id; S.ai.dateIdx = Math.max(0, C(id).d.findIndex(x => x[0] === C(id).date)); S.ai.out = null; go('ai'); break;
    case 'mkind': S.matchKind = v; render(); break;
    case 'mmode': S.marketMode = v; render(); break;
    case 'mcat': S.marketCat = v; render(); break;
    case 'newRide': rideForm(); break;
    case 'newTrade': tradeForm(); break;
    case 'seg': el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'apply': apply(el.dataset.type, id); break;
    case 'fixForm': fixForm(id, 'time'); break;
    case 'fixField': fixForm(id, v); break;
    case 'fixDel': delFix(id, v); break;
    case 'applyForce': closeSheet(); apply(el.dataset.type, id, true); break;
    case 'cancelReq': cancelReq(el.dataset.type, id); break;
    case 'reveal': revealTo(el.dataset.to); break;
    case 'manage': openManage(el.dataset.type, id); break;
    case 'accept': accept(el.dataset.who); break;
    case 'decline': decline(el.dataset.who); break;
    case 'removeMember': removeMember(el.dataset.who); break;
    case 'delPost': openSheet('確定刪除？', '<p style="font-size:14px">刪除後，這則貼文和所有申請紀錄都會一起刪除。</p><div class="actions"><button class="btn line" data-act="close" style="flex:1">取消</button><button class="btn danger" style="flex:1" data-act="doDelPost" data-type="' + esc(el.dataset.type) + '" data-id="' + esc(id) + '">刪除</button></div>'); break;
    case 'doDelPost': deletePost(el.dataset.type, id); break;
    case 'plan': if (!usePlan()) break; S.ai.mob = myMob(); S.ai.out = makePlan(S.ai); bump('plan', S.ai.from); if (S.ai.out && S.ai.out.opt) bump('mode', S.ai.out.opt.mode); render(); break;
    case 'planGuide': { const o = v === 'g' ? S.group && S.group.out : S.ai.out; if (o) guideSheet(o, v); break; }
    case 'guideImg': guideImage(Number(v) || 0); break;
    case 'saveMob': saveMob(); break;
    case 'pushOn': pushOn(); break;
    case 'pushOff': pushOff(); break;
    case 'todoAdd': case 'todoDel': case 'todoDone': case 'vote': case 'pollSave': prepAct(act, id || v); break;
    case 'goPlus': closeSheet(); go('plus'); break;
    case 'plusBuy': plusCheckout(v); break;
    case 'plusColor': if (isPlus()) { S.plus.color = v; applyTheme(); render(); plusUpdate({ color: v }); } break;
    case 'plusRenew': plusUpdate({ autoRenew: v === '1' }).then(() => toast(v === '1' ? '已恢復自動續訂' : '已取消自動續訂，到期前仍可使用')); break;
    case 'plusEnd': if (confirm('立即結束 Plus（測試用）？')) F.deleteDoc(F.doc(db, 'subs', uid())).then(() => toast('已結束 Plus'), e2 => toast(errMsg(e2))); break;
    case 'newSeen': S.newShows = null; render(); break;
    case 'notifyOn': if ('Notification' in window) Notification.requestPermission().then(() => render()); break;
    case 'spAddP': case 'spDelP': case 'spAddI': case 'spDelI': splitAct(act, el, v); break;
    case 'favIcs': if (!isPlus()) { plusSheet('一次把收藏全部匯出到行事曆'); break; } saveIcs(myFavs().flatMap(c => icsEvents(c, true)), 'fanverse-收藏.ics'); toast('已下載，打開就能一次加入行事曆'); break;
    case 'favImg': if (!isPlus()) { plusSheet('把收藏做成追星月曆圖'); break; } favImage(); break;
    case 'planImg': downloadPlan(); break;
    case 'planIcs': { const o = v === 'g' ? S.group && S.group.out : S.ai.out; if (o) planIcs(o); break; }
    case 'planSplit': { const o = v === 'g' ? S.group && S.group.out : S.ai.out; if (o) planToSplit(o, v === 'g' ? 'g_' + S.group.id : 'solo', S.profile ? S.profile.nickname : '我'); break; }
    case 'group': openGroup(id); break;
    case 'gTab': if (S.group) { S.group.tab = ['plan', 'rev', 'split', 'prep'].includes(v) ? v : 'chat'; S.group.editing = false; if (v === 'rev') { S.group.revReady = false; const r = groupRide(); if (r && rideDay(r) < todayTW()) loadRevState(r); } renderGroup(); } break;
    case 'revGood': sendRev(v, true); break;
    case 'revBad': sendRev(v, false); break;
    case 'revDel': delRev(v); break;
    case 'block': blockUser(v); break;
    case 'blockYes': doBlock(v, true); break;
    case 'unblock': doBlock(v, false); break;
    case 'repPost': repPost(el.dataset.type, id); break;
    case 'adminDel': adminDelPost(el.dataset.type, id); break;
    case 'admDismiss': admAct('dismiss', id); break;
    case 'admBan': admAct('ban', v); break;
    case 'admUnban': admAct('unban', v); break;
    case 'admDelTarget': admAct('delTarget', id); break;
    case 'admReload': S.admin = null; render(); break;
    case 'share': shareConcert(id); break;
    case 'ics': downloadIcs(id); break;
    case 'gEdit': if (S.group) { S.group.editing = true; renderGroup(); } break;
    case 'gEditCancel': if (S.group) { S.group.editing = false; renderGroup(); } break;
    case 'groupPlanImg': if (S.group && S.group.out) downloadPlan(S.group.out); break;
    case 'delMsg': delMsg(id); break;
    case 'repMsg': repMsg(id); break;
    case 'frSample': S.fraud.text = '大巨蛋 2 張連號搖滾區，急售！比原價便宜 2000，今天先付訂金 1000 保留，加 LINE 私聊，用賣貨便連結下單，客服會幫你做金流驗證'; S.fraud.out = null; render(); break;
    case 'fraud': if (!S.fraud.text.trim()) toast('先貼上一則訊息'); else { S.fraud.out = ruleFraud(S.fraud.text); render(); } break;
    case 'authTab': S.authTab = v; render(); break;
    case 'checkVerified': checkVerified(); break;
    case 'resendVerify': resendVerify(); break;
    case 'signOut': S.authTab = 'login'; if (A) A.signOut(auth); break;
    case 'editNick': editNick(); break;
    case 'sendReset': sendReset(); break;
    case 'deleteAcct': deleteForm(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value.slice(0, 60); S.sugOpen = true; S.sugIdx = -1; updateHome(); const x = $('.sclear'); if (!!S.q !== !!x) { const pos = t.selectionStart; render(); const q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (_) { } S.sugOpen = true; renderSug(); } }
  else if (t.id === 'frText') S.fraud.text = t.value.slice(0, 1200);
  else if (t.id === 'pfBirth') { const bd = parseBirthday(t.value); const g = $('#guardianBox'); if (g) g.hidden = !(bd && !isAdult(bd)); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'mConcert') { S.matchConcert = t.value; render(); }
  else if (t.id === 'rC') { const box = $('#rDBox'); if (box) box.innerHTML = rideDateSel(t.value); const f = $('#rideF'); if (f) delete f.dataset.force; }
  else if (t.id === 'aiC') { S.ai.concert = t.value; S.ai.dateIdx = 0; S.ai.out = null; render(); }
  else if (t.id === 'aiDate') { S.ai.dateIdx = Number(t.value) || 0; S.ai.out = null; render(); }
  else if (t.id === 'aiFrom') { if (REGIONS[t.value]) S.ai.from = t.value; S.ai.out = null; render(); }
  else if (t.id === 'aiMode') { if (MODES.includes(t.value)) S.ai.mode = t.value; S.ai.out = null; render(); }
  else if (t.id === 'aiGo') { if (GO_DAYS.includes(t.value)) S.ai.go = t.value; S.ai.out = null; render(); }
  else if (t.id === 'aiBack') { if (BACK_DAYS.includes(t.value)) S.ai.back = t.value; S.ai.out = null; render(); }
  else if (t.id === 'aiGoT') { S.ai.goTime = TIME_RE.test(t.value) ? t.value : ''; S.ai.out = null; }
  else if (t.id === 'aiBackBy') { S.ai.backBy = TIME_RE.test(t.value) ? t.value : ''; S.ai.out = null; }
  else if (t.id === 'aiB') { S.ai.budget = t.value; S.ai.out = null; render(); }
  else if (t.id === 'aiAcc') { S.ai.acc = !!t.checked; S.ai.accAuto = false; S.ai.out = null; render(); }
  else if (t.id === 'gMyFrom') { if (S.group) { saveLS('fv_myfrom_' + S.group.id, REGIONS[t.value] ? t.value : ''); renderGroup(); } }
  else if (t.id === 'pfBirth') { const bd = parseBirthday(t.value); const g = $('#guardianBox'); if (g) g.hidden = !(bd && !isAdult(bd)); }
  else if (t.id === 'tFile' && t.files && t.files[0]) {
    try {
      let url = await compress(t.files[0], 360);
      if (url.length > 150000) url = await compress(t.files[0], 240);
      if (url.length > 150000) throw new Error('size');
      tradeImg = url;
      const p = $('#tPrev'); if (p) { const img = document.createElement('img'); img.id = 'tPrev'; img.className = 'thumb'; img.alt = '預覽'; img.src = url; p.replaceWith(img); }
    } catch (_) { tradeImg = ''; toast('這張照片無法使用，換一張試試'); }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'loginF') doLogin(f);
  else if (f.id === 'regF') doRegister(f);
  else if (f.id === 'resetF') doReset(f);
  else if (f.id === 'profF') doProfile(f);
  else if (f.id === 'rideF') submitRide(f);
  else if (f.id === 'tradeF') submitTrade(f);
  else if (f.id === 'nickF') submitNick(f);
  else if (f.id === 'delF') deleteAccount(f);
  else if (f.id === 'chatF') sendChat();
  else if (f.id === 'fixF') submitFix(f);
  else if (f.id === 'gPlanF') savePlan(f);
  else if (f.id === 'plusF') submitPlus(f);
});
document.addEventListener('focusin', e => { if (e.target.id === 'q') { S.sugOpen = true; S.sugIdx = -1; renderSug(); } });
document.addEventListener('focusout', e => { if (e.target.id === 'q') setTimeout(() => { if (document.activeElement && document.activeElement.id === 'q') return; S.sugOpen = false; renderSug(); }, 120); });
document.addEventListener('keydown', e => {
  if (e.target.id !== 'q') return;
  const n = (S.sugItems || []).length;
  if (e.key === 'ArrowDown' && n) { e.preventDefault(); S.sugOpen = true; S.sugIdx = (S.sugIdx + 1) % n; renderSug(); }
  else if (e.key === 'ArrowUp' && n) { e.preventDefault(); S.sugIdx = S.sugIdx <= 0 ? n - 1 : S.sugIdx - 1; renderSug(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (S.sugIdx >= 0) pickSug(S.sugIdx); else { addRecent(S.q); S.sugOpen = false; renderSug(); e.target.blur(); } }
  else if (e.key === 'Escape') { S.sugOpen = false; S.sugIdx = -1; renderSug(); }
});
// 用 pointerdown 而不是 click，才不會因為輸入框先失去焦點、清單先關掉而點不到
document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-sg]'); if (!el) return; e.preventDefault(); pickSug(Number(el.dataset.sg)); });
$('#veil').addEventListener('click', e => { if (e.target.id === 'veil') closeSheet(); });

/* ---------- boot ---------- */
async function boot() {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  // 防止別的網站把 FANVERSE 嵌進框架裡誘騙點擊（GitHub Pages 無法設定 frame-ancestors，所以用程式擋）
  if (window.top !== window.self) { document.body.innerHTML = '<p style="padding:24px;font:16px sans-serif">為了安全，請直接開啟 <a href="https://fanverse-team.github.io/" target="_top">fanverse-team.github.io</a></p>'; return; }
  document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[data-out]'); if (a) bump('out', a.dataset.out); }, true);
  route();
  loadConcerts(); loadHotels(); loadArts(); loadExtras();
  if (!firebaseConfig || !firebaseConfig.apiKey || /^YOUR_/.test(firebaseConfig.apiKey)) { S.mode = 'off'; S.note = '尚未設定 Firebase，帳號功能暫停'; render(); return; }
  try {
    const [appM, authM, fsM, acM] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js'), import(FB + 'firebase-app-check.js').catch(() => null)]);
    A = authM; F = fsM;
    const app = appM.initializeApp(firebaseConfig);
    // 只在真的要讀寫資料庫或登入時才向 reCAPTCHA 取得驗證（不自動更新），省下每月免費驗證次數
    if (acM) { try { acM.initializeAppCheck(app, { provider: new acM.ReCaptchaEnterpriseProvider(RECAPTCHA_SITE_KEY), isTokenAutoRefreshEnabled: false }); } catch (e) { } }
    auth = A.getAuth(app); auth.languageCode = 'zh-TW';
    db = F.getFirestore(app);
    countVisit();
    A.onAuthStateChanged(auth, onUser);
  } catch (e) { S.mode = 'off'; S.note = '無法連線到帳號系統，請檢查網路後重新整理'; render(); }
}
boot();
</script>
